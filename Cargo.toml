[package]
name = "nexus-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Native desktop foundation for NEXUS"
license = "UNLICENSED"

[workspace]
resolver = "3"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
