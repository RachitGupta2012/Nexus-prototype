[package]
name = "nexus-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Native desktop foundation for NEXUS"
license = "UNLICENSED"

[workspace]
resolver = "3"

[features]
default = ["telemetry"]
telemetry = ["dep:sysinfo"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = { version = "0.40.1", default-features = false, features = ["system"], optional = true }
serde_json = "1"
ureq = { version = "3.5.1", features = ["json", "platform-verifier"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["fs"] }
rfd = { version = "0.18", default-features = false }
keyring = { version = "4.2", default-features = false, features = ["v1"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
