[package]
name = "nexus-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Native desktop API workbench for NEXUS"
license = "UNLICENSED"

[workspace]
resolver = "3"

[features]
default = ["telemetry"]
telemetry = ["dep:sysinfo"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = { version = "0.40.1", default-features = false, features = ["system"], optional = true }
serde_json = "1"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "stream"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
futures-util = "0.3"
rusqlite = { version = "0.42", features = ["bundled"] }
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.2", default-features = false, features = ["v1"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
